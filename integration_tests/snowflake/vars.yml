vars:
  dbt_cost_optimization_enabled: true

  # Point the package's snowflake_usage source at the fixture tables
  # (models/fixtures/, built into <target schema>_fixtures).
  snowflake_usage_database: "{{ target.database }}"
  snowflake_usage_schema: "{{ target.schema }}_fixtures"

  # Materialization slice uses the Standard-edition path (query-text attribution),
  # so only the query_history fixture is needed.
  snowflake_enterprise_edition: false

  # Clustering slice: the demo table is small, so drop the size floor.
  clustering_candidates_min_size_gb: 0

  # Clustering slice: analyze 10 of DEMO_EVENTS' 20 reads, so the clustering savings'
  # filter share must use the analyzed count (10), not all reads (20).
  clustering_key_operator_queries_per_table: 10
