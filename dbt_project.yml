name: 'dbt_cost_optimization_package'
version: '3.0.0'
config-version: 2

profile: 'dbt_cost_optimization_package'

model-paths: ["models"]
docs-paths: ["docs"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

require-dbt-version: [">=1.0.0"]

# Model configurations
models:
  dbt_cost_optimization_package:
    +schema: dbt_cost_optimization
    # Shared platform-agnostic models (always enabled for ref resolution)
    shared:
      +materialized: view
      +enabled: "{{ var('dbt_cost_optimization_enabled', false) }}"
    # Snowflake optimization models
    snowflake:
      +enabled: "{{ target.type == 'snowflake' and var('dbt_cost_optimization_enabled', false) }}"
      staging:
        +materialized: view
        stg_snowflake__access_history:
          +enabled: "{{ target.type == 'snowflake' and var('dbt_cost_optimization_enabled', false) and var('snowflake_enterprise_edition', true) }}"
        stg_snowflake__cortex_rest_api_usage:
          +enabled: "{{ target.type == 'snowflake' and var('dbt_cost_optimization_enabled', false) and var('ai_rest_api_enabled', true) }}"
      intermediate:
        +materialized: view
        int_snowflake__query_table_access:
          +enabled: "{{ target.type == 'snowflake' and var('dbt_cost_optimization_enabled', false) and var('snowflake_enterprise_edition', true) }}"
        int_snowflake__column_query_access:
          +enabled: "{{ target.type == 'snowflake' and var('dbt_cost_optimization_enabled', false) and var('snowflake_enterprise_edition', true) }}"
        int_snowflake__column_query_stats:
          +enabled: "{{ target.type == 'snowflake' and var('dbt_cost_optimization_enabled', false) and var('snowflake_enterprise_edition', true) }}"
        int_snowflake__direct_object_access:
          +enabled: "{{ target.type == 'snowflake' and var('dbt_cost_optimization_enabled', false) and var('snowflake_enterprise_edition', true) }}"
      marts:
        clustering:
          +tags: ['clustering', 'dbt_cost_optimization']
        materialization:
          +tags: ['materialization', 'dbt_cost_optimization']
        warehouse:
          +tags: ['warehouse', 'dbt_cost_optimization']
        ai:
          +tags: ['ai_spend', 'dbt_cost_optimization']
        gold:
          +tags: ['gold', 'dbt_cost_optimization']
    # Redshift optimization models
    redshift:
      +enabled: "{{ target.type == 'redshift' and var('dbt_cost_optimization_enabled', false) }}"
      staging:
        +materialized: view
      intermediate:
        +materialized: view
    # BigQuery optimization models
    bigquery:
      +enabled: "{{ target.type == 'bigquery' and var('dbt_cost_optimization_enabled', false) }}"
      staging:
        +materialized: view
      intermediate:
        +materialized: view
    # Databricks optimization models
    databricks:
      +enabled: "{{ target.type == 'databricks' and var('dbt_cost_optimization_enabled', false) }}"

# Package variables are defined in vars.yml (parsed before dbt_project.yml)
# Override in consuming project's vars.yml or dbt_project.yml vars: section
