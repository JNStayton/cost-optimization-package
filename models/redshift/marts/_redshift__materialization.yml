version: 2

models:
  - name: fct_redshift__table_materialization_candidates
    description: >
      dbt VIEW and EPHEMERAL models that are candidates for conversion to TABLE
      materialization:

        rebuild_cost_score    = downstream_build_time_s   (informational)
        query_activity_score  = select_count * avg_gb_scanned_per_query * relative_duration_ratio   (informational)
        composite_chain_score = query_activity_score + downstream_build_time_s

      downstream_build_time_s is the SUM, across every downstream table a
      view feeds, of that table's own average attributed build cost —
      averaged separately per downstream table first, then summed. This
      keeps a single expensive downstream table from skewing the figure
      applied to every other, cheaper downstream table the view also feeds.
      Because downstream_build_time_s is a true per-view total,
      composite_chain_score is a plain sum with no downstream_table_count
      multiplier applied anywhere.

      min_hops_to_table is deliberately excluded from the score: the
      cascading recomputation of an upstream view through several layers of
      inlining is already fully captured inside downstream_build_time_s, so
      multiplying by hop count on top of that would double-count the same
      cost — and in the wrong direction, since materializing the view
      closest to a downstream table eliminates more cumulative work than
      materializing one further away. Retained as an informational column
      only.

      Query attribution uses int_redshift__query_view_access, which attributes
      via the dbt manifest graph (int_redshift__view_terminal_ancestors)
      rather than Redshift's own pg_depend catalogs or query_text matching —
      this works identically for late-binding and regular views, since it
      never depends on pg_depend at all.

      View chain analysis uses int_redshift__view_chains to detect views that sit
      upstream of TABLE or INCREMENTAL materializations.

      Controlled by the following dbt variables:
        - table_materialization_min_query_count      (default 10) — output pre-filter
        - table_materialization_min_composite_score   (default 50) — recommendation threshold
        - table_materialization_lookback_days         (default 14, controls upstream lookback)
    config:
      materialized: table
    columns:
      - name: snapshot_date
        description: Calendar date when this analysis was run.

      - name: analyzed_at
        description: Timestamp when this model run produced the record.

      - name: table_fqn
        description: Fully-qualified view name in database.schema.table format (lowercased).

      - name: database_name
        description: Redshift database containing the view.

      - name: schema_name
        description: Schema containing the view.

      - name: table_name
        description: Name of the evaluated view.

      - name: dbt_model
        description: dbt unique_id of the model that produced this view.

      - name: model_name
        description: dbt model name (filename without extension).

      - name: package_name
        description: dbt package the model belongs to.

      - name: materialized
        description: Current materialization type of the model. One of view, ephemeral.

      - name: select_count
        description: >
          Approximate count of distinct SELECT queries attributed to this view over
          the lookback window (via APPROXIMATE COUNT DISTINCT).

      - name: avg_query_duration_s
        description: Average execution time in seconds for attributed SELECT queries.

      - name: relative_duration_ratio
        description: >
          This view's avg_query_duration_s divided by the project-wide average.
          Values > 1 indicate this view is slower than average. 0 for unqueried views.

      - name: total_gb_scanned
        description: >
          Total gigabytes of overlap_input_bytes scanned by SELECT queries attributed
          to this view over the lookback window.

      - name: avg_gb_scanned_per_query
        description: Average gigabytes scanned per attributed SELECT query.

      - name: is_in_view_chain
        description: >
          True when this view appears in int_redshift__view_chains — i.e., it has at
          least one downstream TABLE or INCREMENTAL materialization.

      - name: min_hops_to_table
        description: >
          Minimum number of hops from this view to the nearest downstream TABLE
          or INCREMENTAL materialization. Null when is_in_view_chain is false.
          Informational only — not part of composite_chain_score (see model
          description for why: depth alone isn't a measured cost, since view
          chains are inlined into a single execution plan, and using it as a
          multiplier let it dominate ranking whenever query_activity_score was
          weak or zero).

      - name: downstream_table_count
        description: >
          Number of distinct TABLE or INCREMENTAL materializations reachable downstream
          from this view. Not used as a multiplier anywhere in this mart —
          downstream_build_time_s already sums each of those tables' own
          attributed cost individually, so fan-out is correctly reflected
          without a separate multiplication step.

      - name: rebuild_cost_score
        description: >
          Equal to downstream_build_time_s. Informational alias, kept for
          continuity with earlier revisions of this mart — see
          composite_chain_score for how it combines with query_activity_score.
          Naturally 0 for a terminal view with no downstream dbt consumers.
          Known limitation, not a bug: if two views share a terminal ancestor
          (e.g. a view built on top of another view that depends on the same
          source), the same downstream scan step can legitimately be
          attributed to both — this accurately reflects that materializing
          either view eliminates that rescan, but means this column should
          not be summed across rows as if disjoint.

      - name: query_activity_score
        description: >
          select_count * avg_gb_scanned_per_query * relative_duration_ratio.
          See composite_chain_score for how it combines with
          downstream_build_time_s. Naturally 0 for a view with no direct
          SELECT activity in the lookback window.

      - name: composite_chain_score
        description: >
          query_activity_score + downstream_build_time_s. A plain sum — no
          downstream_table_count or min_hops_to_table multiplier. Both terms
          are already complete, correctly-scaled totals on their own; see
          downstream_build_time_s's own description for why it doesn't need
          a fan-out multiplier applied to it here.

      - name: downstream_build_time_s
        description: >
          SUM, across every downstream TABLE/INCREMENTAL materialization
          reachable from this view, of that table's own average attributed
          rebuild cost — the portion of that table's CTAS build spent
          scanning specifically this view's terminal ancestors
          (int_redshift__view_terminal_ancestors), averaged per downstream
          table first and then summed across tables (not one blended average
          across every downstream table's build events, which let a single
          expensive table drag up the figure applied to every other table
          too). The CTAS build itself is identified precisely via the dbt
          node_id embedded in its query comment, not by bare-name matching
          against query_text.

      - name: has_rebuild_cost_signal
        description: True when rebuild_cost_score > 0 — this view has downstream dbt consumers with measured CTAS build time.

      - name: has_query_activity_signal
        description: >
          True when query_activity_score > 0 — int_redshift__query_view_access
          confirmed at least one query scanned ALL of this view's terminal
          ancestors (resolved via the dbt manifest graph, not pg_depend or
          text matching). False does not mean the view isn't queried — it may
          mean no matching query was found in the lookback window.

      - name: recommendation
        description: >
          'Materialize as TABLE' when composite_chain_score >=
          table_materialization_min_composite_score (default 50); 'Monitor' otherwise.

      - name: recommendation_reason
        description: Human-readable explanation naming which signal(s) (rebuild-cost, query-activity, or both) drove the recommendation.

      - name: recommendation_confidence
        description: >
          One of: high (both has_rebuild_cost_signal and has_query_activity_signal
          are true — two independent signals agree), medium (only one signal
          present), low (neither).

  - name: fct_redshift__incremental_materialization_candidates
    description: >
      dbt TABLE models that are candidates for conversion to INCREMENTAL
      materialization, based on rebuild cost, table size, and rebuild redundancy
      over a configurable lookback window. Excludes this package's own models
      (package_name = 'dbt_cost_optimization_package') so the package never
      recommends converting its own intermediates.

      The key signal is rebuild_redundancy_rate = rows_at_period_start /
      rows_at_period_end. A rate of 0.95 means 95% of every rebuild reprocesses
      identical data. Combined with size and frequency, this produces
      est_daily_redundant_gb_scanned — compute waste quantified in GB/day.

      A model is surfaced when ANY of the following triggers fire:
        - triggered_by_build_time: max rebuild time >= incremental_candidates_min_build_time_sec
          AND table size >= incremental_candidates_min_size_gb
        - triggered_by_compute_waste: compute_waste_score >= incremental_candidates_min_compute_waste_score
          AND avg build time >= incremental_candidates_min_compute_waste_avg_build_sec

      Downstream model fct_redshift__incremental_config_recommendations adds
      strategy recommendations and copy-pasteable config templates.

      Controlled by the following dbt variables:
        - incremental_candidates_lookback_days                   (default 60)
        - incremental_candidates_min_build_time_sec              (default 300)
        - incremental_candidates_min_size_gb                     (default 2)
        - incremental_candidates_min_compute_waste_score         (default 5)
        - incremental_candidates_min_compute_waste_avg_build_sec (default 30)
        - incremental_candidates_min_qualified_build_days        (default 3)
    config:
      materialized: table
    columns:
      - name: snapshot_date
        description: Calendar date when this analysis was run.

      - name: analyzed_at
        description: Timestamp when this model run produced the record.

      - name: analysis_lookback_days
        description: Lookback window used for this analysis run, in days.

      - name: table_fqn
        description: Fully-qualified table name in DATABASE.SCHEMA.TABLE format (uppercased).

      - name: database_name
        description: Redshift database containing the table.

      - name: schema_name
        description: Schema containing the table.

      - name: table_name
        description: Name of the evaluated table.

      - name: dbt_model
        description: dbt unique_id of the model that produced this table.

      - name: model_name
        description: dbt model name (filename without extension).

      - name: package_name
        description: dbt package the model belongs to.

      - name: table_size_gb
        description: Active storage size of the table in gigabytes (from int_redshift__table_inventory).

      - name: total_rows
        description: >
          Approximate row count of the table. Falls back to the most recent CTAS
          rows_inserted snapshot when the inventory value is zero or stale.

      - name: table_build_count
        description: Number of full table rebuilds (CTAS) detected in the lookback window.

      - name: builds_per_day
        description: Average number of full rebuilds per day over the lookback window.

      - name: max_build_time_sec
        description: Maximum full-rebuild execution time in seconds over the lookback window.

      - name: avg_build_time_sec
        description: Average full-rebuild execution time in seconds over the lookback window.

      - name: select_count
        description: Total SELECT queries against this table in the lookback window.

      - name: avg_query_duration_s
        description: Average SELECT query execution time in seconds over the lookback window.

      - name: dml_count
        description: Total INSERT, UPDATE, DELETE, and MERGE operations in the lookback window.

      - name: insert_count
        description: INSERT operations in the lookback window.

      - name: update_count
        description: UPDATE operations in the lookback window.

      - name: delete_count
        description: DELETE operations in the lookback window.

      - name: merge_count
        description: MERGE operations in the lookback window.

      - name: qualified_build_days
        description: >
          Number of days in the lookback window where a CTAS build was recorded
          with a non-null rows_inserted snapshot. Must meet
          incremental_candidates_min_qualified_build_days for the growth signal
          to be considered reliable.

      - name: rows_at_period_start
        description: Row count from the earliest qualifying CTAS build in the lookback window.

      - name: rows_at_period_end
        description: Row count from the most recent qualifying CTAS build in the lookback window.

      - name: rebuild_redundancy_rate
        description: >
          Fraction of each full rebuild that re-processes unchanged rows
          (rows_at_period_start / rows_at_period_end). Null when growth signal is
          unreliable or history is insufficient. A rate of 0.95 means 95% of every
          rebuild reprocesses identical data.

      - name: growth_signal_reliable
        description: >
          True when qualified_build_days >= incremental_candidates_min_qualified_build_days
          and row count did not decrease during the lookback window. False when
          history is too thin or a mid-lookback row count drop suggests a
          full-refresh or upstream deletes.

      - name: compute_waste_score
        description: >
          Dimensionless composite waste signal: size_gb × (table_build_count / lookback_days).
          Used as a secondary trigger alongside the build time threshold.

      - name: est_daily_redundant_gb_scanned
        description: >
          Estimated GB scanned per day that is redundant
          (size_gb × builds_per_day × rebuild_redundancy_rate). Null when growth
          signal is unreliable. Primary sort key for the output.

      - name: recommendation
        description: >
          Redundancy-based tier. One of: Strong Candidate (rate >= 0.90),
          Candidate (rate >= 0.70), Candidate — Moderate Redundancy (rate >= 0.50),
          Low ROI — Minimal Rebuild Redundancy (rate < 0.50),
          Candidate — Verify Growth Signal, Candidate — Insufficient History.

      - name: recommendation_reason
        description: Human-readable explanation of the redundancy signal and triggering metrics.

      - name: triggered_by_build_time
        description: True when max_build_time_sec >= incremental_candidates_min_build_time_sec.

      - name: triggered_by_size
        description: True when table_size_gb >= incremental_candidates_min_size_gb.

      - name: triggered_by_compute_waste
        description: >
          True when compute_waste_score >= incremental_candidates_min_compute_waste_score
          and avg_build_time_sec >= incremental_candidates_min_compute_waste_avg_build_sec.

  - name: fct_redshift__incremental_config_recommendations
    description: >
      Model 2 of the incremental materialization recommendation flow. Depends on
      fct_redshift__incremental_materialization_candidates (Model 1).

      For each candidate table, detects the best filter column (timestamp/date),
      ranks unique key candidates by naming convention, probes cardinality via
      APPROXIMATE COUNT(DISTINCT) (post-hook) to confirm likely_unique_key,
      recommends an incremental strategy, and generates a copy-pasteable dbt
      config template with the is_incremental() filter block pre-filled.

      Excludes 'Low ROI — Minimal Rebuild Redundancy' tables from Model 1.

      Strategy selection priority:
        1. External deletes detected + filter column  → delete+insert (flagged)
        2. External deletes detected, no filter       → merge (flagged)
        3. Unique key + filter + large scale          → delete+insert
        4. Unique key + filter, moderate scale        → merge
        5. Filter only, no DML                        → append
        6. Filter only, external DML, no key          → append (flag manual review)
        7. Unique key only                            → merge
        8. No key candidates                          → append

      Note: Redshift does not support dbt's microbatch strategy. Large append-only
      tables fall through to append rather than microbatch.

      Controlled by the following dbt variables:
        - incremental_large_table_row_threshold        (default 10000000)
        - incremental_large_table_gb_threshold         (default 10)
        - incremental_unique_key_probe_threshold       (default 0.95)
    config:
      materialized: table
    columns:
      - name: snapshot_date
        description: Calendar date when this analysis was run.

      - name: analyzed_at
        description: Timestamp when this model run produced the record.

      - name: table_fqn
        description: Fully-qualified table name in DATABASE.SCHEMA.TABLE format (uppercased).

      - name: database_name
        description: Redshift database containing the table.

      - name: schema_name
        description: Schema containing the table.

      - name: table_name
        description: Name of the evaluated table.

      - name: dbt_model
        description: dbt unique_id of the model that produced this table.

      - name: model_name
        description: dbt model name (filename without extension).

      - name: package_name
        description: dbt package the model belongs to.

      - name: redundancy_tier
        description: Redundancy classification from Model 1.

      - name: redundancy_reason
        description: Human-readable explanation of the Model 1 redundancy signal.

      - name: rebuild_redundancy_rate
        description: Fraction of each full rebuild that re-processes unchanged rows.

      - name: est_daily_redundant_gb_scanned
        description: Estimated GB scanned per day that is redundant.

      - name: table_size_gb
        description: Active storage size of the table in gigabytes.

      - name: total_rows
        description: Approximate row count of the table.

      - name: table_build_count
        description: Number of full table rebuilds detected in the analysis window.

      - name: builds_per_day
        description: Average number of full rebuilds per day over the analysis window.

      - name: max_build_time_sec
        description: Maximum full-rebuild execution time in seconds over the analysis window.

      - name: avg_build_time_sec
        description: Average full-rebuild execution time in seconds over the analysis window.

      - name: dml_count
        description: Total INSERT, UPDATE, DELETE, and MERGE operations in the analysis window.

      - name: insert_count
        description: INSERT operations in the analysis window.

      - name: update_count
        description: UPDATE operations in the analysis window.

      - name: delete_count
        description: DELETE operations in the analysis window.

      - name: merge_count
        description: MERGE operations in the analysis window.

      - name: incremental_strategy
        description: >
          Recommended dbt incremental strategy. One of: append, merge, delete+insert.
          Note: Redshift does not support microbatch — large append-only tables use append.

      - name: has_filter_column
        description: True when a timestamp or date column was detected for use in the is_incremental() filter.

      - name: has_unique_key_candidate
        description: True when at least one plausible unique key candidate was detected by naming convention.

      - name: has_external_deletes
        description: True when delete_count > 0, indicating an external process deletes rows from this table.

      - name: is_large_table
        description: >
          True when total_rows > incremental_large_table_row_threshold OR
          table_size_gb > incremental_large_table_gb_threshold.

      - name: suggested_filter_column
        description: >
          Best timestamp or date column for the is_incremental() WHERE filter,
          ranked by name pattern. Null when no qualifying column is found.

      - name: unique_key_candidates
        description: >
          SUPER array of up to 3 plausible unique key column names ordered by naming
          convention rank. Uniqueness is verified by the probe_unique_key_candidates
          post-hook — use likely_unique_key for the confirmed result.

      - name: best_unique_key
        description: >
          Top unique key candidate from naming convention detection (rank 1).
          Not uniqueness-verified — use likely_unique_key when populated.

      - name: likely_unique_key
        description: >
          First column in unique_key_candidates confirmed as likely unique by the
          probe_unique_key_candidates post-hook (APPROXIMATE COUNT(DISTINCT) / COUNT(*) >= threshold).
          Null when no single-column unique key is found.

      - name: strategy_notes
        description: Human-readable rationale for the recommended strategy, including key column names and any caveats.

      - name: validate_uniqueness_sql
        description: >
          SQL snippet to run against the candidate table to confirm unique key suitability.
          Updated by the post-hook to reference likely_unique_key when confirmed.

      - name: dbt_config_template
        description: >
          Copy-pasteable dbt config block and is_incremental() filter for the
          recommended strategy, with detected column names pre-filled. Updated by
          the post-hook to use likely_unique_key when confirmed.
