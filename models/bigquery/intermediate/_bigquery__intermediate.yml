version: 2

models:

  # ===========================================================================
  # int_bigquery__tables
  # ===========================================================================
  - name: int_bigquery__tables
    description: >
      BigQuery table metadata: table type, clustering_key (regex-parsed from the
      table's DDL), and is_deleted (from stg_bigquery__table_storage).
    columns:
      - name: database_name
        description: BigQuery project ID (aliased from table_catalog)
      - name: schema_name
        description: BigQuery dataset name (aliased from table_schema)
      - name: table_name
        description: Table name
      - name: table_type
        description: BigQuery native table type (BASE TABLE, VIEW, MATERIALIZED VIEW, etc.)
      - name: clustering_key
        description: >
          Clustering columns extracted from the table's DDL via regex
          (`CLUSTER BY col1, col2`), null if the table isn't clustered
      - name: is_deleted
        description: >
          Whether the table is soft-deleted and still within its time-travel window,
          from stg_bigquery__table_storage's deleted flag
      - name: platform
        description: Source data platform identifier (bigquery)

  # ===========================================================================
  # int_bigquery__table_storage
  # ===========================================================================
  - name: int_bigquery__table_storage
    description: >
      BigQuery table storage metrics: active bytes, row/partition counts, and
      deletion state, used by int_bigquery__table_inventory.
    columns:
      - name: database_name
        description: BigQuery project ID (aliased from project_id)
      - name: schema_name
        description: BigQuery dataset name
      - name: table_name
        description: Table name
      - name: active_bytes
        description: Active physical storage in bytes (aliased from active_physical_bytes)
      - name: is_deleted
        description: Whether the table is soft-deleted and still within its time-travel window
      - name: total_rows
        description: Total row count
      - name: total_partitions
        description: >
          Total partition count. BigQuery-specific extra column used downstream as the
          data-density proxy in clustering-candidate scoring, in place of Snowflake's
          real per-query partition-pruning ratio (not available in JOBS_BY_PROJECT).
      - name: platform
        description: Source data platform identifier (bigquery)

  # ===========================================================================
  # int_bigquery__table_inventory
  # ===========================================================================
  - name: int_bigquery__table_inventory
    description: >
      BigQuery table inventory combining table metadata and storage metrics.
    columns:
      - name: platform
        description: Source data platform identifier (bigquery)
      - name: database_name
        description: BigQuery project ID
      - name: schema_name
        description: BigQuery dataset name
      - name: table_name
        description: BigQuery table name
      - name: table_fqn
        description: Fully-qualified table name (project.dataset.table)
      - name: table_type
        description: BigQuery native table type (BASE TABLE, MATERIALIZED VIEW)
      - name: normalized_table_type
        description: Human-readable table classification
      - name: row_count
        description: Total row count from TABLE_STORAGE
      - name: clustering_key
        description: Clustering columns parsed from DDL (e.g. "col1, col2"), null if unclustered
      - name: is_already_clustered
        description: Whether the table has a CLUSTER BY definition
      - name: active_bytes
        description: Active physical storage in bytes (from TABLE_STORAGE), 0 if no storage data
      - name: size_gb
        description: Active storage converted to GB, 0 if no storage data
      - name: approx_micropartitions
        description: >
          Data density proxy. BigQuery = total_partitions (actual date/range partition count
          from TABLE_STORAGE). Snowflake equivalent is active_bytes / 16 MB.

  # ===========================================================================
  # int_bigquery__query_history
  # ===========================================================================
  - name: int_bigquery__query_history
    description: >
      BigQuery query execution history. Passes through referenced_tables and
      destination_table — the engine-populated attribution signal
      int_bigquery__table_query_stats_daily and int_bigquery__column_query_access
      cross-join/unnest against, replacing an earlier query-text
      LIKE '%table_name%' heuristic.
    columns:
      - name: query_id
        description: BigQuery job_id
      - name: query_start_time
        description: Job creation timestamp (aliased from creation_time)
      - name: bytes_scanned
        description: Total bytes billed for the job (aliased from total_bytes_billed) — BigQuery's primary cost signal
      - name: statement_type
        description: "BigQuery statement type: SELECT, INSERT, UPDATE, DELETE, MERGE, CREATE_TABLE_AS_SELECT, etc."
      - name: execution_time_ms
        description: >
          Total slot-milliseconds consumed (aliased from total_slot_ms) — BigQuery's
          parallel CPU-weighted compute measure, not wall-clock time
      - name: query_text
        description: Full SQL text of the job's query (aliased from query)
      - name: referenced_tables
        description: >
          Array of tables the job actually read (engine-populated), each a struct of
          project_id/dataset_id/table_id — the exact-attribution signal downstream
          models cross-join/unnest against.
      - name: destination_table
        description: >
          The table the job wrote to (struct of project_id/dataset_id/table_id), for write
          statement types. Used downstream to exclude a write job's own target from its
          own read attribution.
      - name: execution_status
        description: >
          Normalized job outcome: SUCCESS (state=DONE, no error), FAILED (state=DONE,
          has error), or the raw uppercased state otherwise (PENDING, RUNNING)
      - name: platform
        description: Source data platform identifier (bigquery)

  # ===========================================================================
  # int_bigquery__table_query_stats_daily
  # ===========================================================================
  - name: int_bigquery__table_query_stats_daily
    description: >
      Incremental daily query statistics per BigQuery table. Attribution uses
      JOBS_BY_PROJECT.referenced_tables (engine-populated, exact) for reads and
      destination_table for writes — a job's own destination is excluded from its reads
      so MERGE/CTAS don't double-count.
    columns:
      - name: table_query_stats_daily_key
        description: Surrogate key for stats_date + table relation
      - name: platform
        description: Source data platform identifier (bigquery)
      - name: stats_date
        description: Date grain of aggregated query statistics
      - name: table_database
        description: BigQuery project ID
      - name: table_schema
        description: BigQuery dataset name
      - name: table_name
        description: BigQuery table name
      - name: total_query_count
        description: select_count + dml_count
      - name: select_count
        description: >
          Count of distinct jobs that read the table via referenced_tables (any statement
          type — a CREATE_TABLE_AS_SELECT reading this table as a source counts here too),
          excluding jobs whose own destination_table is this table
      - name: dml_count
        description: Count of distinct INSERT/UPDATE/DELETE/MERGE/CREATE_TABLE_AS_SELECT jobs whose destination_table is this table
      - name: select_execution_time_ms_sum
        description: >
          Sum of total_slot_ms for matched SELECT jobs — BigQuery's parallel
          CPU-weighted compute measure, not wall-clock time.
      - name: select_bytes_billed_sum
        description: >
          Sum of total_bytes_billed for matched SELECT jobs — BigQuery's primary
          cost signal, used by fct_bigquery__table_clustering_candidates for scoring.

  # ===========================================================================
  # int_bigquery__table_columns
  # ===========================================================================
  - name: int_bigquery__table_columns
    description: >
      Column metadata for active BigQuery tables, scoped to int_bigquery__table_inventory.
      Filters to BigQuery's clustering-eligible data type allow-list (BIGNUMERIC,
      BOOL, DATE, DATETIME, GEOGRAPHY, INT64, NUMERIC, RANGE, STRING, TIMESTAMP) and
      excludes partitioning columns (which prune before clustering). Mirrors the
      role of
      int_snowflake__table_columns. Real cardinality for these columns is populated by
      refresh_bigquery_column_cardinality into int_bigquery__column_cardinality.
    columns:
      - name: database_name
        description: BigQuery project ID
      - name: schema_name
        description: BigQuery dataset name
      - name: table_name
        description: Table name
      - name: table_fqn
        description: Fully-qualified table name (project.dataset.table)
      - name: column_name
        description: Column name
        tests:
          - not_null
      - name: ordinal_position
        description: Column position in the table definition (1-based)
      - name: data_type
        description: >
          BigQuery data type; restricted to the canonical clustering-eligible
          allow-list (BIGNUMERIC, BOOL, DATE, DATETIME, GEOGRAPHY, INT64, NUMERIC,
          RANGE, STRING, TIMESTAMP).
      - name: is_nullable
        description: Whether the column allows null values ('YES'/'NO')
      - name: clustering_ordinal_position
        description: >
          Existing position of this column in the table's CLUSTER BY definition,
          if any. Null when the column is not part of an existing clustering key.
          Used for observability only — not factored into scoring.

  # ===========================================================================
  # int_bigquery__column_cardinality
  # ===========================================================================
  - name: int_bigquery__column_cardinality
    description: >
      Persistent store for BigQuery column-level APPROX_COUNT_DISTINCT values produced by
      the refresh_bigquery_column_cardinality macro. dbt creates the empty table schema
      on first run; all data is written and maintained exclusively by the macro, which
      runs as a post-hook on fct_bigquery__table_clustering_candidates. dbt never
      inserts rows directly — the incremental model always returns 0 rows, preserving
      macro-written data across runs.
    columns:
      - name: table_fqn
        description: Fully-qualified table name (project.dataset.table)
      - name: column_name
        description: Column name
      - name: distinct_values
        description: Approximate distinct value count from APPROX_COUNT_DISTINCT
      - name: total_rows
        description: Total row count of the table at time of scan
      - name: calculated_at
        description: Timestamp when the macro last populated or updated this record

  # ===========================================================================
  # int_bigquery__column_query_access
  # ===========================================================================
  - name: int_bigquery__column_query_access
    description: >
      One row per (query_id, table_fqn, column_name). The table match is exact —
      JOBS_BY_PROJECT.referenced_tables, excluding a write statement's own
      destination_table — but the column match is still heuristic: BigQuery has no
      equivalent of Snowflake's ACCESS_HISTORY column-level lineage, so this model
      regex-extracts substrings rooted at WHERE / JOIN ON / ORDER BY clauses from the
      already-correctly-attributed query's text, then matches column names with
      word-boundary regex against int_bigquery__table_columns. May over-match on
      comments embedded in filter clauses, and cannot resolve CTE / alias mappings.
      Disable by setting use_query_text_attribution=false.
    columns:
      - name: query_id
        description: BigQuery job_id
      - name: query_start_time
        description: Query creation timestamp from JOBS_BY_PROJECT
      - name: table_fqn
        description: Fully-qualified table name (project.dataset.table)
      - name: table_database
        description: BigQuery project ID
      - name: table_schema
        description: BigQuery dataset name
      - name: table_name
        description: Table name component of the FQN
      - name: column_name
        description: Column referenced in the query's filter context

  # ===========================================================================
  # int_bigquery__column_query_stats
  # ===========================================================================
  - name: int_bigquery__column_query_stats
    description: >
      Daily column-level query access counts for BigQuery tables, aggregated from
      int_bigquery__column_query_access. One row per (access_date, table_fqn,
      column_name). Incremental merge with a 1-day lookback buffer for late-arriving
      JOBS_BY_PROJECT data. Mirrors int_snowflake__column_query_stats, but values are
      heuristic (regex-extracted) rather than engine-attested. Used by
      fct_bigquery__clustering_key_candidates for usage scoring and by the
      refresh_bigquery_column_cardinality macro to pre-filter which columns are worth
      scanning. Disable by setting use_query_text_attribution=false.
    config:
      materialized: incremental
    columns:
      - name: column_query_stats_daily_key
        description: Surrogate key derived from md5(access_date || table_fqn || column_name)
        tests:
          - unique
          - not_null
      - name: table_fqn
        description: Fully-qualified table name
      - name: table_database
        description: BigQuery project ID
      - name: table_schema
        description: BigQuery dataset name
      - name: table_name
        description: Table name component of the FQN
      - name: column_name
        description: Column name
      - name: access_date
        description: Calendar date of the query access
      - name: query_count
        description: Count of distinct query_ids that accessed this column on this date
