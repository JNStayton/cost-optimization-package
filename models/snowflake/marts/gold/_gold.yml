version: 2

models:
  - name: vw_snowflake__top_recommendations
    description: >
      Flagship gold-layer view. P1 (actionable now) signals only, deduplicated
      per entity (highest savings as representative). Includes related_signals_count
      to indicate additional optimizations available.
    columns:
      - name: priority_rank
        description: Rank by estimated annual savings (1 = highest savings)
        data_tests:
          - not_null
      - name: signal_id
        description: Unique signal identifier matching the optimization priorities mapping
        data_tests:
          - not_null
      - name: related_signals_count
        description: Total P1 signals for this entity (1 = only this one, 2+ = more available)
      - name: snowflake_ddl
        description: Ready-to-execute ALTER statement (when applicable)
      - name: dbt_model_config
        description: Copy-paste dbt config block (when applicable)
      - name: domain
        data_tests:
          - accepted_values:
              arguments:
                values: ['ai', 'clustering', 'materialization', 'warehouse']

  - name: vw_snowflake__cost_savings_summary
    description: >
      KPI card view — one row per domain showing total optimization opportunity.
      Designed for dashboard top-level summary tiles.
    columns:
      - name: domain
        description: Optimization domain
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ai', 'clustering', 'materialization', 'warehouse']
      - name: total_recommendations
        description: Count of actionable recommendations in this domain
      - name: estimated_annual_savings_usd
        description: Total estimated savings opportunity in this domain

  - name: vw_snowflake__optimization_backlog
    description: >
      Full optimization backlog for sprint planning. Shows ALL priority tiers.
      Each row is self-contained — an agent can create a ticket from it.
      Users filter by priority_tier to focus on specific tiers.
    columns:
      - name: signal_id
        description: Unique signal identifier
        data_tests:
          - not_null
      - name: priority_tier
        description: Per-entity relative priority (1 = do first for this entity, 2 = do second, etc.)
      - name: effort_category
        description: Effort required — used for sprint planning grouping
        data_tests:
          - accepted_values:
              arguments:
                values: ['actionable_review', 'architecture', 'config_change', 'investigation', 'sql_refactor']
      - name: action_type
        description: Type of fix (snowflake_ddl, dbt_config, investigation)
        data_tests:
          - accepted_values:
              arguments:
                values: ['dbt_config', 'investigation', 'snowflake_ddl']
      - name: domain
        data_tests:
          - accepted_values:
              arguments:
                values: ['ai', 'clustering', 'materialization', 'warehouse']

  - name: vw_snowflake__cross_domain_insights
    description: >
      Cross-domain signal detection. For each table with 2+ optimization signals from
      different domains, surfaces the signals as an array and picks the primary
      recommendation using a ranked hierarchy. view_chain (the table's builds recompute
      upstream views and ephemerals) is a signal; with spillage or an expensive query,
      recommended_action adds the chain's recommended view to materialize.
    columns:
      - name: signals
        description: Array of detected optimization signals (e.g., ['spillage', 'clustering', 'view_chain'])
      - name: recommended_action
        description: >
          The model's own top action (materialization, incremental, clustering). With a
          view chain plus spillage or an expensive query: plus "additionally, materialize
          <chain_recommended_view> as a table", or the chain as the headline when the
          model has no other action.
      - name: upstream_view_chain
        description: Views and ephemerals the model's builds recompute inline, nearest first, each with its materialization.
      - name: upstream_view_count
        description: Number of views and ephemerals in upstream_view_chain.
      - name: chain_recommended_view
        description: The view chain's recommended view to materialize, if any.
      - name: signal_count
        description: Number of distinct signals detected (2+ for this view)
      - name: primary_recommendation
        description: The highest-priority fix based on the signal hierarchy
      - name: primary_domain
        description: Domain of the primary recommendation
      - name: root_cause
        description: Why these signals co-occur on the same table
      - name: insight_id
        data_tests:
          - not_null

  - name: vw_snowflake__dbt_model_optimizations
    description: >
      dbt model-level optimizations: materialization, clustering, and incremental config.
      Only shows ACTIONABLE items (excludes investigate and do_not_recommend statuses).
      Excludes warehouse and AI domain recommendations. Enriched with suggested clustering keys.
      Ordered by model_name then priority_tier (1 = do first for this model).
    columns:
      - name: priority_tier
        description: Per-entity relative priority (1 = highest priority for this model based on hierarchy)
      - name: suggested_clustering_key
        description: Recommended clustering columns from clustering_key_candidates (e.g., 'order_date, customer_id')
      - name: dbt_model_config
        description: Full dbt config block for incremental conversion (when applicable)
      - name: identified_unique_key
        description: Confirmed unique key name for merge incrementals (NULL for append)
      - name: incremental_confidence_score
        description: Confidence in the incremental recommendation (0-100; NULL if no strategy proposed)
      - name: incremental_blocking_signals
        description: Array of factors reducing confidence (e.g., low_build_frequency, key_not_exact_or_nullable)
      - name: chain_role
        description: >
          materialize_as_table only: 'recommended' (the view to materialize in its chain)
          or 'standalone'. Alternatives in the same chain are monitor status, so they
          don't appear in this view.
      - name: chosen_view_for_chain
        description: materialize_as_table only. The recommended view's FQN (this row's own for a recommended view).
      - name: recompute_cost_s
        description: materialize_as_table only. Seconds per run of the view's query, which its cost and savings are priced from.
      - name: recompute_cost_source
        description: materialize_as_table only. 'probe' (measured by the view probe) or 'reads' (average read duration).
      - name: environment_ids
        description: Array of dbt_cloud_environment_ids where this model exists
      - name: signal_id
        data_tests:
          - not_null
      - name: domain
        data_tests:
          - accepted_values:
              arguments:
                values: ['ai', 'clustering', 'materialization', 'warehouse']
      - name: effort_category
        data_tests:
          - accepted_values:
              arguments:
                values: ['actionable_review', 'architecture', 'config_change', 'investigation', 'sql_refactor']

  - name: vw_snowflake__warehouse_optimizations
    description: >
      Warehouse-level optimizations: one row per (warehouse, signal category).
      Config recs are standalone rows. Model-level signals (spillage, expensive queries)
      are aggregated with affected_models context. Audience: Snowflake admins.
    columns:
      - name: warehouse_current_size
        description: Authoritative current warehouse size from WAREHOUSE_EVENTS_HISTORY
      - name: warehouse_category
        description: Warehouse type category (standard, gen2, multi_cluster, adaptive)
      - name: signal_id
        description: Signal type (idle_reduce_auto_suspend, spillage_moderate_worsening, etc.)
        data_tests:
          - not_null
      - name: snowflake_ddl
        description: Concrete ALTER WAREHOUSE DDL (for config recs)
      - name: affected_model_count
        description: Count of models contributing to this signal (for aggregated model-level signals)
      - name: affected_models_in_view_chains
        description: >
          Spillage rows: the spilling models whose builds recompute upstream views, each
          with its upstream view count, e.g. 'fct_order_items (4 upstream view(s))'.
      - name: view_chain_note
        description: >
          Spillage rows with models in view chains: how many of the spilling models
          recompute upstream views, and a pointer to vw_snowflake__dbt_model_optimizations
          for the view to materialize.
      - name: affected_models
        description: Comma-separated list of affected model names
      - name: warehouse_name
        data_tests:
          - not_null
      - name: effort_category
        data_tests:
          - accepted_values:
              arguments:
                values: ['actionable_review', 'architecture', 'config_change', 'investigation', 'sql_refactor']
      - name: backlog_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['actionable', 'monitor', 'stable']

  - name: vw_snowflake__top_expensive_queries
    description: >
      Top 10 most expensive recurring queries within the project scope. Covers
      both dbt model builds and downstream consumer queries. Audience: dbt
      developers and Snowflake admins.
    columns:
      - name: query_hash
        description: Unique identifier for this recurring query pattern
        data_tests:
          - not_null
      - name: estimated_annual_cost_usd
        description: Projected annual cost at current run rate
      - name: recommendation
        description: Actionable recommendation for this query

  - name: vw_snowflake__ai_optimizations
    description: >
      AI/Cortex optimization recommendations. Covers model cost (downgrade, prompt bloat),
      token efficiency (failure rates, I/O ratios), agent cost trends, and spend overview.
      Audience: AI/ML teams and platform engineers.
    columns:
      - name: service_or_model
        description: AI service, model name, or agent identifier
        data_tests:
          - not_null
      - name: estimated_annual_savings_usd
        description: Estimated annual savings from applying the recommendation
      - name: effort_category
        data_tests:
          - accepted_values:
              arguments:
                values: ['actionable_review', 'architecture', 'config_change', 'investigation', 'sql_refactor']
      - name: backlog_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['actionable', 'monitor', 'stable']

  - name: vw_snowflake__user_level_cost_attribution
    description: >
      User-level cost attribution across three categories: dbt build users,
      consumption users (SELECT queries against project models), and AI users.
    columns:
      - name: user_name
        description: Snowflake user driving the cost
        data_tests:
          - not_null
      - name: combined_credits_30d
        description: Total credits (build + consumption + AI) consumed in the last 30 days
      - name: estimated_annual_cost_usd
        description: Projected annual cost at current rate
      - name: user_category
        data_tests:
          - accepted_values:
              arguments:
                values: ['ai_user', 'builder', 'consumer', 'mixed', 'unknown']
      - name: credits_from_attribution
        description: >
          True when any of the user's build or consumption credits came from
          QUERY_ATTRIBUTION_HISTORY (precise per-query credits). False means all
          credits are estimated from elapsed time x warehouse list rate.

  - name: vw_snowflake__top_spillage_models
    columns:
      - name: upstream_view_count
        description: Views and ephemerals this model's builds recompute inline (0 when none).
      - name: upstream_view_chain
        description: Those views and ephemerals, nearest first, each with its materialization.
      - name: table_fqn
        data_tests:
          - not_null
      - name: model_source
        data_tests:
          - accepted_values:
              arguments:
                values: ['installed_package', 'project']
      - name: spillage_signal_count
        description: Number of distinct spillage signals for this model
      - name: all_spillage_signals
        description: Comma-separated list of all spillage signal_ids (e.g., 'spillage_moderate_stable, spillage_scale_up')

  - name: vw_snowflake__top_queried_models
    columns:
      - name: table_fqn
        data_tests:
          - not_null
