version: 2

models:
  - name: vw_snowflake__top_recommendations
    description: >
      Flagship gold-layer view. Ranked list of actionable optimization recommendations
      across all domains, deduplicated by logical dbt model (node_id). Ordered by
      estimated annual savings.
    columns:
      - name: priority_rank
        description: Rank by estimated annual savings (1 = highest savings)
      - name: domain
        description: Optimization domain (warehouse, materialization, clustering, ai)
      - name: effort_category
        description: Effort required (config_change, sql_refactor, architecture)
      - name: estimated_annual_savings_usd
        description: Estimated annual savings in USD if recommendation is applied

  - name: vw_snowflake__cost_savings_summary
    description: >
      KPI card view — one row per domain showing total optimization opportunity.
      Designed for dashboard top-level summary tiles.
    columns:
      - name: domain
        description: Optimization domain
      - name: total_recommendations
        description: Count of actionable recommendations in this domain
      - name: estimated_annual_savings_usd
        description: Total estimated savings opportunity in this domain

  - name: vw_snowflake__optimization_backlog
    description: >
      Full optimization backlog for sprint planning and agent consumption.
      Includes ALL tiers (actionable, monitor, stable). Each row is self-contained —
      an agent can create a ticket from any single row.
    columns:
      - name: effort_category
        description: Effort required — used for sprint planning grouping
      - name: backlog_status
        description: Current status (actionable, monitor, stable)
      - name: actionable_sql
        description: Ready-to-execute SQL or dbt config change
      - name: dbt_config_template
        description: Full dbt config block for incremental conversion (when applicable)
      - name: validate_uniqueness_sql
        description: SQL to validate unique key before applying incremental config

  - name: vw_snowflake__recommendations_by_environment
    description: >
      Environment drill-down view. Does NOT collapse by node_id — every physical FQN
      gets its own row. Filterable by target_name for environment-specific views.
    columns:
      - name: has_prod_relation
        description: True if this row represents a production environment relation
      - name: has_nonprod_only
        description: True if this model only exists in non-production environments

  - name: vw_snowflake__recommendations_by_model
    description: >
      Model-centric view that collapses recommendations by logical dbt model (node_id).
      Same model in multiple environments shows once, with the prod environment preferred.
      Now includes cost estimation fields (estimated_annual_cost_usd, estimated_annual_savings_usd).
    columns:
      - name: node_id
        description: dbt node identifier (e.g., model.my_project.my_model)
      - name: all_table_fqns
        description: Array of all physical FQNs for this logical model across environments
      - name: estimated_annual_savings_usd
        description: Estimated annual savings in USD
      - name: actionable_sql
        description: Ready-to-execute SQL or config change

  - name: vw_snowflake__cross_domain_insights
    description: >
      Cross-domain correlation insights. Detects cases where recommendations from
      different domains point to the same root cause or compound each other.
      Each row is a detected multi-signal pattern with recommended fix order.
    columns:
      - name: insight_id
        description: Deterministic hash ID for the insight
      - name: insight_type
        description: Correlation type (e.g., spillage_plus_clustering, view_chain_plus_spillage)
      - name: domains_involved
        description: Array of domains that contribute to this insight
      - name: root_cause
        description: Identified root cause connecting the domain signals
      - name: recommended_fix_order
        description: Which optimization to apply first for maximum impact

  - name: vw_snowflake__expensive_users
    description: >
      User-level cost attribution across expensive queries and AI usage.
      Aggregates credits consumed by user for chargeback and awareness dashboards.
    columns:
      - name: user_name
        description: Snowflake user driving the cost
      - name: combined_credits_30d
        description: Total credits (query + AI) consumed in the last 30 days
      - name: estimated_annual_cost_usd
        description: Projected annual cost at current rate
      - name: recommendation
        description: Action guidance based on spend tier
