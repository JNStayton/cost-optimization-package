version: 2

models:
  # ===========================================================================
  # fct_databricks__incremental_model_candidates
  # ===========================================================================
  - name: fct_databricks__incremental_model_candidates
    description: >
      Daily snapshot of dbt TABLE-materialized models on Databricks that are
      candidates for conversion to INCREMENTAL, with strategy recommendations
      (merge / delete+insert / microbatch / insert_overwrite / append) and
      copy-pasteable config templates.

      Strategy selection considers: observed DML pattern (inserts vs updates vs
      deletes vs merges), Delta clustering state, a date/timestamp filter column
      suggestion from int_databricks__column_cluster_suggestions, and a table-size
      tier driven by avg_bytes_scanned per build. The probe_unique_key_candidates()
      post-hook then validates the top-ranked unique key candidates using
      approx_count_distinct; when no single-column key passes the threshold,
      strategies that depend on a unique key are downgraded to append to avoid
      silent data corruption.

      Controlled by the following dbt variables:
        - incremental_candidates_lookback_days                (default 7)
        - incremental_candidates_min_avg_bytes_scanned_gb     (default 0.1)
        - incremental_candidates_min_run_count                (default 3)
        - incremental_candidates_large_table_gb_threshold     (default 10)
        - incremental_unique_key_probe_threshold              (default 0.95)
    config:
      materialized: incremental
      enabled: "{{ target.type == 'databricks' }}"
    columns:
      # ---------------------------------------------------------------------------
      # Snapshot metadata
      # ---------------------------------------------------------------------------
      - name: snapshot_date
        description: Calendar date of the snapshot. Combined with dbt_model to form the unique key for incremental loads.
        tests:
          - not_null
      - name: incremental_candidates_snapshot_key
        description: >
          Surrogate key for the snapshot row. Derived from md5(snapshot_date || dbt_model).
          Used as the merge key for the incremental materialization — one record per
          model per day.
        tests:
          - not_null
          - unique

      # ---------------------------------------------------------------------------
      # Model identity
      # ---------------------------------------------------------------------------
      - name: dbt_model
        description: dbt unique_id of the evaluated model (e.g. model.my_project.my_model).
        tests:
          - not_null
      - name: model_name
        description: dbt model name (file basename, before alias).
      - name: materialized
        description: Current materialization of the model. Only `table`-materialized models are flagged as candidates; other materializations are still scored for context.
      - name: table_fqn
        description: Fully-qualified table identifier in CATALOG.SCHEMA.TABLE format.
      - name: database_name
        description: Databricks catalog containing the table backing the model.
      - name: schema_name
        description: Databricks schema containing the table backing the model.
      - name: table_name
        description: Name of the table backing the model.

      # ---------------------------------------------------------------------------
      # Run history (lookback window)
      # ---------------------------------------------------------------------------
      - name: run_count
        description: >
          Number of times this model was built in the lookback window
          (controlled by incremental_candidates_lookback_days, default 7).
      - name: first_seen
        description: Timestamp of the earliest model run observed in the lookback window.
      - name: last_seen
        description: Timestamp of the most recent model run observed in the lookback window.

      # ---------------------------------------------------------------------------
      # Scan and compute metrics
      # ---------------------------------------------------------------------------
      - name: total_bytes_scanned_gb
        description: Sum of bytes_scanned across all runs in the lookback window, converted to GB.
      - name: avg_bytes_scanned_gb
        description: >
          Average bytes_scanned per run in the lookback window, converted to GB.
          Used by the strategy logic as a proxy for table size when applying the
          large-table size tier (incremental_candidates_large_table_gb_threshold).
      - name: total_execution_time_s
        description: Sum of execution_time across all runs in the lookback window, in seconds.
      - name: avg_execution_time_s
        description: Average execution_time per run in the lookback window, in seconds.
      - name: estimated_monthly_runs
        description: run_count projected to a 30-day month based on the lookback window. Used to size cost-savings estimates.
      - name: estimated_monthly_bytes_scanned_gb
        description: avg_bytes_scanned_gb × estimated_monthly_runs. Approximate monthly scan volume the recommendation would replace.
      - name: score
        description: avg_bytes_scanned_gb × run_count. Composite ranking signal — higher values indicate more total compute waste from rebuilds in the lookback window.

      # ---------------------------------------------------------------------------
      # Candidacy
      # ---------------------------------------------------------------------------
      - name: is_candidate
        description: >
          True when the model meets all of: materialized='table',
          avg_bytes_scanned_gb >= incremental_candidates_min_avg_bytes_scanned_gb (default 0.1),
          and run_count >= incremental_candidates_min_run_count (default 3).
          Drives whether a recommendation is surfaced; models below the thresholds
          are still scored for transparency.
      - name: recommendation_reason
        description: >
          Human-readable rationale for surfacing the model as a candidate, citing
          the avg scan volume and run count over the lookback window. Null when
          is_candidate is false.

      # ---------------------------------------------------------------------------
      # DML breakdown (lookback window)
      # ---------------------------------------------------------------------------
      - name: insert_count
        description: Count of INSERT statements observed against the underlying table in the lookback window. Sourced from int_databricks__table_query_stats_daily.
      - name: update_count
        description: Count of UPDATE statements observed against the underlying table. Drives merge/delete+insert recommendations.
      - name: delete_count
        description: Count of DELETE statements observed against the underlying table. Triggers the external-deletes warning in strategy_notes.
      - name: merge_count
        description: Count of MERGE statements observed against the underlying table. Drives merge / delete+insert recommendations.

      # ---------------------------------------------------------------------------
      # Filter column detection (cluster-suggestion inputs)
      # ---------------------------------------------------------------------------
      - name: suggested_filter_column
        description: >
          Date / timestamp column suggested as the is_incremental() filter, sourced
          from int_databricks__column_cluster_suggestions. Used to scope
          delete+insert / append load windows and to populate microbatch event_time.
      - name: suggested_filter_column_confidence
        description: Confidence rating from int_databricks__column_cluster_suggestions on the suggested filter column. Pass-through from upstream.
      - name: filter_column_data_type
        description: >
          Data type of the suggested_filter_column (e.g. timestamp, timestamp_ntz,
          date). Filtered to date/timestamp types in the strategy decision — non-temporal
          cluster columns are ignored for incremental filter selection.

      # ---------------------------------------------------------------------------
      # Graph context
      # ---------------------------------------------------------------------------
      - name: downstream_model_count
        description: Number of dbt models that depend on this model. Useful for prioritizing recommendations — converting a high-fanout model to incremental yields larger downstream savings.

      # ---------------------------------------------------------------------------
      # Strategy recommendation outputs
      # ---------------------------------------------------------------------------
      - name: suggested_incremental_strategy
        description: >
          Recommended incremental_strategy for the model. One of: merge,
          delete+insert, microbatch, insert_overwrite, append. May be downgraded
          to append by the probe_unique_key_candidates() post-hook if no
          single-column unique key passes the cardinality probe.
        tests:
          - accepted_values:
              arguments:
                values: ['merge', 'delete+insert', 'microbatch', 'insert_overwrite', 'append']
      - name: suggested_incremental_strategy_confidence
        description: "Confidence of the strategy recommendation: HIGH (updates/merges observed), MEDIUM (deletes observed without updates), LOW (no DML history or insert-only)."
      - name: strategy_notes
        description: >
          Human-readable rationale for the chosen strategy, including operational
          warnings (e.g. external deletes will be missed by incremental loads
          outside the filter window).
      - name: validate_uniqueness_sql
        description: >
          Ready-to-run SQL that verifies whether suggested_unique_key is truly
          unique on the source table. Re-pointed to likely_unique_key by the
          post-hook when the probe finds a different confirmed key.
      - name: incremental_filter_template
        description: >
          Copy-pasteable Jinja block (is_incremental() filter) scoped to
          suggested_filter_column. For microbatch, replaced with a note that
          microbatch handles filtering via event_time in config.
      - name: updated_model_config
        description: >
          Copy-pasteable dbt config block for the model, parameterized to the
          recommended strategy and unique_key. The post-hook swaps the
          unique_key value when the cardinality probe confirms a different
          column than the name-pattern-ranked suggestion.
      - name: microbatch_config_template
        description: >
          Alternative microbatch config template, populated when the model is
          merge-suggested but exhibits an append-dominant insert pattern and has
          a timestamp filter column. Null otherwise.

      # ---------------------------------------------------------------------------
      # Unique key detection (added with top-N + probe-hook improvements)
      # ---------------------------------------------------------------------------
      - name: suggested_unique_key
        description: >
          Top-ranked unique key candidate by naming convention (surrogate_key,
          *_sk, id, *_id, *_key, *_uuid, etc.), excluding timestamp / date /
          float / double / boolean columns. Uniqueness is NOT verified at this
          stage — see likely_unique_key for the post-hook-confirmed value.
      - name: unique_key_candidates
        description: >
          Array of the top three name-pattern-ranked unique key candidates, in
          rank order. Probed by probe_unique_key_candidates() in order; the
          first column whose approx_count_distinct exceeds the threshold (default
          0.95 of total_rows) is written to likely_unique_key. Provides fallback
          options when the top-ranked candidate fails the cardinality check.
      - name: likely_unique_key
        description: >
          Confirmed unique key from the probe_unique_key_candidates() post-hook.
          Populated only when at least one column in unique_key_candidates passed
          the cardinality threshold. Null when no single-column key passed — in
          that case suggested_incremental_strategy is downgraded to append.

      # ---------------------------------------------------------------------------
      # Boolean flags for downstream filtering
      # ---------------------------------------------------------------------------
      - name: has_filter_column
        description: True when int_databricks__column_cluster_suggestions surfaced a date/timestamp filter column for the table.
      - name: has_unique_key_candidate
        description: True when at least one column matched the name-pattern unique key heuristic. Does NOT imply uniqueness was confirmed — see likely_unique_key.
      - name: has_external_deletes
        description: True when delete_count > 0 in the lookback window. Signals that incremental loads will miss out-of-window deletes; periodic full-refresh recommended.
      - name: is_large_table
        description: True when avg_bytes_scanned per build exceeds incremental_candidates_large_table_gb_threshold (default 10 GB). Triggers delete+insert / microbatch preference over merge / append.

  # ===========================================================================
  # fct_databricks__table_materialization_candidates
  # ===========================================================================
  - name: fct_databricks__table_materialization_candidates
    description: >
      Daily snapshot of dbt VIEW and EPHEMERAL models on Databricks evaluated
      as candidates for conversion to TABLE materialization, based on query
      volume, data scan cost, query duration relative to project average, and
      view-chain depth.

      Two recommendation paths are evaluated:

        1. View-chain path: any model in a view/ephemeral chain that ultimately
           feeds a table receives a recommendation when its composite_chain_score
           is positive. The score combines per-query scan cost, project-relative
           duration, downstream-table build time, hops-to-table, and number of
           downstream tables — surfacing views whose recomputation cascades.

        2. Isolated-view path: views not in any chain are recommended when
           either (a) materialization_score > 500 AND total_gb_scanned > 10, or
           (b) avg_query_duration_s > 10 AND select_count > 50.

      Query attribution uses ILIKE substring matching against query_text from
      int_databricks__query_history. Known limitation: view names that are
      substrings of other identifiers may produce false-positive matches.

      Controlled by the following dbt variables:
        - table_materialization_lookback_days   (default 14)
        - table_materialization_min_query_count (default 10)
    config:
      materialized: table
      enabled: "{{ target.type == 'databricks' }}"
    columns:
      # ---------------------------------------------------------------------------
      # Snapshot metadata
      # ---------------------------------------------------------------------------
      - name: snapshot_date
        description: Calendar date of the snapshot.
      - name: analyzed_at
        description: Timestamp when this model run produced the record.

      # ---------------------------------------------------------------------------
      # Model identity
      # ---------------------------------------------------------------------------
      - name: table_fqn
        description: Fully-qualified model identifier in DATABASE.SCHEMA.TABLE format (uppercased).
      - name: database_name
        description: Databricks catalog containing the view or ephemeral relation.
      - name: schema_name
        description: Databricks schema containing the view or ephemeral relation.
      - name: table_name
        description: Name of the view or ephemeral relation.
      - name: dbt_model
        description: dbt unique_id of the model.
      - name: model_name
        description: dbt model name (file basename, before alias).
      - name: package_name
        description: dbt package the model belongs to.
      - name: materialized
        description: "Current materialization of the model: 'view' or 'ephemeral'."
        tests:
          - accepted_values:
              arguments:
                values: ['view', 'ephemeral']

      # ---------------------------------------------------------------------------
      # Query activity (isolated-view scoring inputs)
      # ---------------------------------------------------------------------------
      - name: select_count
        description: Distinct SELECT queries observed against the view in the lookback window.
      - name: avg_query_duration_s
        description: Average per-query execution time in seconds across SELECT queries that hit the view.
      - name: relative_duration_ratio
        description: This view's avg_query_duration_s divided by the project-wide average across all evaluated views. Normalizes out warehouse-size differences when ranking.
      - name: total_gb_scanned
        description: Sum of bytes_scanned across SELECT queries on the view in the lookback window, converted to GB.
      - name: avg_gb_scanned_per_query
        description: total_gb_scanned divided by select_count. Used in the composite_chain_score formula.
      - name: materialization_score
        description: "select_count × avg_query_duration_s. Primary signal for the isolated-view recommendation path (threshold: > 500 paired with > 10 GB scanned)."

      # ---------------------------------------------------------------------------
      # View-chain scoring inputs
      # ---------------------------------------------------------------------------
      - name: is_in_view_chain
        description: True when the model has at least one downstream table reachable through a chain of view/ephemeral hops (as identified by int_databricks__view_chains).
      - name: min_hops_to_table
        description: Shortest distance, in edges, from this view to any downstream terminal table. Null when not in a view chain.
      - name: downstream_table_count
        description: Count of distinct terminal tables reachable from this view through any view/ephemeral chain.
      - name: downstream_build_time_s
        description: Average build time (in seconds) of the downstream terminal tables, inferred from CREATE_TABLE_AS / INSERT / MERGE statements in the last 30 days that matched against each downstream table's name.
      - name: composite_chain_score
        description: >
          (greatest(select_count, 1) × avg_gb_scanned_per_query × relative_duration_ratio
            + downstream_build_time_s) × min_hops_to_table × greatest(downstream_table_count, 1).
          Any positive value triggers the recommendation for chain members.

      # ---------------------------------------------------------------------------
      # Recommendation
      # ---------------------------------------------------------------------------
      - name: recommendation
        description: "'Materialize as TABLE' when any of the three recommendation paths fires; 'Monitor' otherwise."
        tests:
          - accepted_values:
              arguments:
                values: ['Materialize as TABLE', 'Monitor']
      - name: recommendation_reason
        description: Human-readable rationale for the recommendation, citing the specific signal that triggered it (hops + downstream table count, scan volume, or query frequency + duration).

  # ===========================================================================
  # fct_databricks__snapshot_optimization_candidates
  # ===========================================================================
  - name: fct_databricks__snapshot_optimization_candidates
    description: >
      Daily snapshot of dbt SNAPSHOT-resource models on Databricks evaluated for
      optimization opportunities. Surfaces three classes of recommendation:

        1. Pause snapshot       — snapshot has run repeatedly but no new SCD-2
                                  versions were added in the lookback window.
        2. Reduce run frequency — productive_run_pct is low and total scan cost
                                  is non-trivial; running less often would cut
                                  compute without sacrificing change capture.
        3. Switch to timestamp  — snapshot uses 'check' strategy but its source
                                  table has a column matching common updated_at
                                  naming patterns; timestamp strategy avoids the
                                  per-column comparison cost.

      Pulls snapshot configs from int_dbt__snapshots, run history from
      stg_databricks__query_history (parsed by node_id from dbt-attributed
      statements), and change activity from int_databricks__table_query_stats_daily.
      For Tier 2 strategy fit, joins to stg_databricks__columns against the
      snapshot's primary parent FQN to detect updated_at-like columns.

      Controlled by the following dbt variables:
        - snapshot_candidates_lookback_days              (default 30)
        - snapshot_candidates_min_run_count              (default 3)
        - snapshot_candidates_min_runs_for_pause         (default 14)
        - snapshot_candidates_low_productivity_threshold (default 0.25)
    config:
      materialized: incremental
      enabled: "{{ target.type == 'databricks' }}"
    columns:
      # ---------------------------------------------------------------------------
      # Snapshot metadata
      # ---------------------------------------------------------------------------
      - name: snapshot_date
        description: Calendar date of the snapshot. Combined with dbt_snapshot to form the merge key.
        tests:
          - not_null
      - name: snapshot_optimization_snapshot_key
        description: >
          Surrogate key for the snapshot row. Derived from md5(snapshot_date || dbt_snapshot).
          Used as the merge key for the incremental materialization — one record per
          snapshot per day.
        tests:
          - not_null
          - unique

      # ---------------------------------------------------------------------------
      # Snapshot identity
      # ---------------------------------------------------------------------------
      - name: dbt_snapshot
        description: dbt unique_id of the snapshot node.
      - name: snapshot_name
        description: Snapshot name as defined in the dbt project.
      - name: package_name
        description: dbt package containing the snapshot.
      - name: table_fqn
        description: Fully-qualified snapshot identifier in CATALOG.SCHEMA.TABLE format (uppercased).
      - name: database_name
        description: Catalog hosting the snapshot table.
      - name: schema_name
        description: Schema hosting the snapshot table.
      - name: table_name
        description: Name of the snapshot table.

      # ---------------------------------------------------------------------------
      # dbt config (pass-through from int_dbt__snapshots)
      # ---------------------------------------------------------------------------
      - name: strategy
        description: "Snapshot strategy: 'timestamp' or 'check'."
      - name: updated_at
        description: Column used by the timestamp strategy. Empty when strategy = 'check'.
      - name: check_cols
        description: Array of columns compared by the check strategy. Empty when strategy = 'timestamp'.
      - name: unique_key
        description: Configured unique key, joined with commas if composite.
      - name: invalidate_hard_deletes
        description: Whether the snapshot closes valid_to on rows missing from the source.
      - name: downstream_model_count
        description: Number of downstream models/snapshots that depend on this snapshot — useful for prioritization.

      # ---------------------------------------------------------------------------
      # Run history (lookback window)
      # ---------------------------------------------------------------------------
      - name: run_count
        description: Total snapshot runs observed in the lookback window (default 30 days).
      - name: total_bytes_scanned_gb
        description: Sum of bytes scanned across all runs in the lookback window, converted to GB.
      - name: avg_bytes_scanned_per_run_gb
        description: Average bytes scanned per run in the lookback window, converted to GB.
      - name: avg_execution_time_per_run_s
        description: Average run duration in seconds across the lookback window.
      - name: first_run_date
        description: Date of the earliest snapshot run observed in the lookback window.
      - name: last_run_date
        description: Date of the most recent snapshot run observed in the lookback window.

      # ---------------------------------------------------------------------------
      # Change activity (DML on the snapshot table)
      # ---------------------------------------------------------------------------
      - name: total_new_versions
        description: >
          Total INSERTs against the snapshot table in the lookback window. For a
          snapshot, INSERTs correspond to new SCD-2 versions (either net-new
          records or new versions of changed records).
      - name: total_supersedes
        description: >
          Total UPDATEs against the snapshot table — the number of valid_to writes
          when prior versions are superseded by new ones.
      - name: total_deletes
        description: Total DELETEs against the snapshot table. Should be zero under normal snapshot operation; non-zero values suggest manual intervention.

      # ---------------------------------------------------------------------------
      # Productivity metrics
      # ---------------------------------------------------------------------------
      - name: total_run_days
        description: Distinct calendar dates within the lookback window on which the snapshot ran at least once.
      - name: productive_run_days
        description: >
          Distinct run-dates on which the snapshot table received at least one INSERT.
          A run-day is "productive" when change capture actually added new versions.
      - name: productive_run_pct
        description: >
          productive_run_days / total_run_days, as a decimal (0.0–1.0). Headline
          metric for the over-frequency recommendation — values below the
          snapshot_candidates_low_productivity_threshold (default 0.25) trigger
          a 'Reduce run frequency' recommendation.
      - name: mb_scanned_per_new_version
        description: >
          total_bytes_scanned (in MB) / total_new_versions. Quantifies the scan
          cost per new SCD-2 version captured. High values indicate the snapshot
          is doing a lot of work for very little change capture.

      # ---------------------------------------------------------------------------
      # Strategy fit (Tier 2)
      # ---------------------------------------------------------------------------
      - name: source_has_updated_at
        description: >
          True when the snapshot's primary parent (first FQN in parent_models)
          has a column matching common updated_at naming patterns
          (updated_at, modified_at, loaded_at, synced_at, etc.) of timestamp or
          date type.
      - name: suggested_updated_at_column
        description: >
          Top-ranked candidate column on the source table that could power a
          timestamp strategy. Ranking prefers explicit updated_at / modified_at
          names over loaded_at / ingested_at over event-time-style columns.
      - name: could_switch_to_timestamp
        description: True when strategy = 'check' AND source_has_updated_at is true. Drives the 'Switch to timestamp strategy' recommendation.

      # ---------------------------------------------------------------------------
      # Recommendation
      # ---------------------------------------------------------------------------
      - name: recommendation
        description: "One of: 'Pause snapshot', 'Reduce run frequency', 'Switch to timestamp strategy', 'No runs in lookback window', 'Healthy'."
        tests:
          - accepted_values:
              arguments:
                values: ['Pause snapshot', 'Reduce run frequency', 'Switch to timestamp strategy', 'No runs in lookback window', 'Healthy']
      - name: recommendation_reason
        description: Human-readable rationale, citing the specific metrics that triggered the recommendation (run count, productive_run_pct, scan totals, MB per new version, or source updated_at column name).
      - name: estimated_monthly_savings_gb
        description: >
          Approximate GB of scan that could be eliminated per month if the
          recommendation is implemented. Null when no recommendation applies.
          For 'Pause snapshot': scales total scan to a 30-day month. For
          'Reduce run frequency': scales (total scan × (1 - productive_run_pct))
          to a 30-day month — i.e. the share of scan attributable to unproductive
          runs.
