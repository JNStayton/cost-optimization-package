# dbt-charts project config for this package's dashboard. See README.md in
# this folder for setup and launch steps.
#
# dbt_project_dir points back at the consuming project's root so `ref()`
# resolves against that project's own target/manifest.json, rather than
# needing a dbt_project.yml here (dbt_packages/ is regenerated by every
# `dbt deps`, so nothing here can carry consumer-specific config). The path
# is fixed: dbt always installs a package at dbt_packages/<package_name>/,
# so this resolves correctly regardless of where the consumer's project
# root actually sits on disk.
#
# If your project overrides the default install location (a custom
# packages-install-path in dbt_project.yml), this relative path will not
# resolve. Point --dbt-project-dir (or the DBT_PROJECT_DIR env var) at your
# project root instead when running dct.
dbt_project_dir: ../../../..

server:
  port: 8501

sources:
  cost_optimization:
    type: dbt_profile
    # Sourced from an env var, not a literal, because dbt_packages/ is
    # regenerated by every `dbt deps` - anything written directly into this
    # file would be silently lost on the next install. Set this once in
    # your shell profile or CI env; see README.md.
    profile: "{{ env_var('DBT_COST_OPT_PROFILE') }}"
