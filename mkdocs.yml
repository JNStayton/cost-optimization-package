# Docs site for this package, built with MkDocs Material (versioned with mike), like
# dbt-project-evaluator. Build locally:
#   pip install -r docs/requirements.txt
#   mkdocs serve          # preview at http://127.0.0.1:8000
#   mkdocs build --strict # fails on broken links
# Publishing (e.g. GitHub Pages with `mike deploy`) isn't set up yet.
site_name: dbt Cost Optimization Package
site_description: Find cost optimization opportunities in your dbt project on Snowflake, Databricks, BigQuery and Redshift.
repo_url: https://github.com/dbt-labs/dbt-cost-optimization-package
repo_name: dbt-labs/dbt-cost-optimization-package
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  # Non-Jinja delimiters: dbt parses docs/ (docs-paths) with Jinja, here and in projects
  # that install the package, so a {% ... %} tag would break their parse.
  - include-markdown:
      opening_tag: "{!"
      closing_tag: "!}"

hooks:
  - docs/hooks/repo_links.py

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# dbt docs blocks and site tooling, not pages
exclude_docs: |
  _*.md
  requirements.txt
  hooks/

nav:
  - Home: index.md
  - Snowflake:
      - Setup and configuration: snowflake/index.md
      - Quick-use commands (macros): snowflake/macros.md
      - Reference:
          - Gold layer design: snowflake/reference/gold_design.md
          - Optimization priorities: snowflake/reference/optimization_priorities_mapping.md
          - Warehouse recommendations: snowflake/reference/warehouse_recommendations.md
          - Warehouse recommendation mapping: snowflake/reference/warehouse_recommendations_mapping.md
          - Materialization recommendations: snowflake/reference/materialization_recommendations.md
          - Incremental config recommendations: snowflake/reference/incremental_config_recommendations.md
          - Incremental recommendation mapping: snowflake/reference/incremental_recommendations_mapping.md
          - Table clustering candidates: snowflake/reference/table_clustering_candidates.md
          - AI and Cortex spend: snowflake/reference/ai_cortex_spend_optimization.md
          - Future optimizations: snowflake/reference/future_optimizations.md
  - Databricks (beta):
      - Incremental model candidates: databricks/incremental_model_candidates.md
      - Liquid clustering candidates: databricks/liquid_clustering_candidates.md
      - OPTIMIZE candidates: databricks/optimize_candidates.md
      - Model run summary: databricks/model_run_summary.md
  - BigQuery (beta):
      - Clustering key candidates: bigquery/clustering_key_candidates.md
  - Redshift (beta):
      - Materialization recommendations: redshift/materialization_recommendations.md
      - Materialization strategy: redshift/materialization-strategy.md
      - Incremental config recommendations: redshift/incremental_config_recommendations.md
  - Testing: testing.md
  - Changelog: changelog.md
